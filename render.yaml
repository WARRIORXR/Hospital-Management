databases:
  - name: queueless-db
    databaseName: queueless
    user: queueless
    plan: free
    region: singapore

services:
  - type: web
    name: queueless-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: queueless-db
          property: connectionString
      # Resolved from the deployed frontend service so CORS survives Render's
      # random onrender.com subdomain suffix instead of being hardcoded.
      - key: FRONTEND_ORIGINS
        fromService:
          type: web
          name: queueless-web
          property: host

  - type: web
    name: queueless-web
    runtime: node
    plan: free
    region: singapore
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      # lib/api.ts adds the https:// scheme when only a host is provided.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: queueless-api
          property: host
