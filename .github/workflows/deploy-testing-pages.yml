# Live development site: builds the frontend from the `testing` branch as a
# static export and publishes it to GitHub Pages.
#
# The static frontend talks to the deployed Render API (NEXT_PUBLIC_API_URL),
# so no backend runs on Pages itself. Real queue flows need the Render
# service to be awake (free tier cold-starts after inactivity).

name: Deploy testing site to GitHub Pages

on:
  push:
    branches: [testing]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-testing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-testing
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout testing branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_API_URL: https://queueless-api-lvf5.onrender.com
          NEXT_PUBLIC_SITE_URL: https://warriorxr.github.io/Hospital-Management/
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
